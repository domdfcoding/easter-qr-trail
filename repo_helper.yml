# Configuration for 'repo_helper' (https://github.com/repo-helper/repo_helper)
---
modname: 'easter-qr-trail'
copyright_years: '2026'
author: 'Dominic Davis-Foster'
email: 'dominic@davis-foster.co.uk'
username: 'domdfcoding'
version: '0.0.0'
license: 'MIT'
short_desc: 'Interactive Easter trail where scanning QR codes reveals an image.'

enable_conda: false
enable_tests: false
enable_docs: false
on_pypi: false
use_whey: true

python_versions:
  - 3.8

manifest_additional:
  - recursive-include easter_qr_trail/static *
  - recursive-include easter_qr_trail/templates *
  - include easter_qr_trail/data.json

additional_ignore:
  - 3456395.jpg
  - state
  - "*.zip"
