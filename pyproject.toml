[build-system]
requires = [ "whey",]
build-backend = "whey"

[project]
name = "easter-qr-trail"
version = "0.0.0"
description = "Interactive Easter trail where scanning QR codes reveals an image."
readme = "README.rst"
keywords = []
dynamic = [ "requires-python", "classifiers", "dependencies",]

[project.license]
file = "LICENSE"

[[project.authors]]
name = "Dominic Davis-Foster"
email = "dominic@davis-foster.co.uk"

[project.urls]
Homepage = "https://github.com/domdfcoding/easter-qr-trail"
"Issue Tracker" = "https://github.com/domdfcoding/easter-qr-trail/issues"
"Source Code" = "https://github.com/domdfcoding/easter-qr-trail"

[tool.whey]
base-classifiers = []
python-versions = [ "3.8",]
python-implementations = [ "CPython",]
platforms = [ "Windows", "macOS", "Linux",]
license-key = "MIT"
package = "easter_qr_trail"
additional-files = [
    "recursive-include easter_qr_trail/static *",
    "recursive-include easter_qr_trail/templates *",
    "include easter_qr_trail/data.json",
]

[tool.importcheck]

[tool.mypy]
python_version = "3.9"
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[tool.dependency-dash."requirements.txt"]
order = 10

[tool.snippet-fmt]
directives = [ "code-block",]

[tool.snippet-fmt.languages.python]
reformat = true

[tool.snippet-fmt.languages.TOML]
reformat = true

[tool.snippet-fmt.languages.ini]

[tool.snippet-fmt.languages.json]
